name: Release

# release-please keeps one release PR open on main. Merging it tags the
# release (v0.1.0 first, from `initial-version` in release-please-config.json)
# and creates the GitHub Release. Consumers reference a plugin by that tag, so
# nothing is published anywhere else.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # release-please writes with the release App's installation token, not
    # GITHUB_TOKEN, so this job grants the default token nothing.
    permissions: {}
    steps:
      # The release PR is opened with a token minted from the
      # dougborg-release-please GitHub App instead of GITHUB_TOKEN, so the
      # pull_request workflows behind the required checks run on it
      # (GITHUB_TOKEN-authored events never trigger other workflows).
      # Without the App credentials the job fails here rather than falling
      # back to GITHUB_TOKEN and opening a release PR that cannot pass.
      - name: Require the release App credentials
        env:
          APP_ID: ${{ vars.RELEASE_PLEASE_APP_ID }}
          PRIVATE_KEY_SET: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$PRIVATE_KEY_SET" != "true" ]; then
            echo "::error::Set the RELEASE_PLEASE_APP_ID variable and RELEASE_PLEASE_APP_PRIVATE_KEY secret (dougborg-release-please App); see the README Releases section."
            exit 1
          fi
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
