# proto plugin for the Fastly CLI: https://github.com/fastly/cli
# Verified against the release's SHA256SUMS file.
name = "fastly"
type = "cli"

[platform.linux]
archs = ["x64", "arm64"]
download-file = "fastly_v{version}_linux-{arch}.tar.gz"
checksum-file = "fastly_v{version}_SHA256SUMS"

[platform.macos]
archs = ["x64", "arm64"]
download-file = "fastly_v{version}_darwin-{arch}.tar.gz"
checksum-file = "fastly_v{version}_SHA256SUMS"

[install]
download-url = "https://github.com/fastly/cli/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/fastly/cli/releases/download/v{version}/{checksum_file}"

[install.arch]
x64 = "amd64"
arm64 = "arm64"

[install.exes.fastly]
primary = true
exe-path = "fastly"

[resolve]
git-url = "https://github.com/fastly/cli"
