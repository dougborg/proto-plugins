# proto plugin for the Pulumi CLI: https://github.com/pulumi/pulumi
# The archive holds the CLI and its language hosts, verified against the release's checksums file.
name = "pulumi"
type = "cli"

[platform.linux]
archs = ["x64", "arm64"]
download-file = "pulumi-v{version}-linux-{arch}.tar.gz"
checksum-file = "pulumi-{version}-checksums.txt"
archive-prefix = "pulumi"
# The language hosts (pulumi-language-nodejs and the rest) must be on PATH beside the CLI.
exes-dirs = ["."]

[platform.macos]
archs = ["x64", "arm64"]
download-file = "pulumi-v{version}-darwin-{arch}.tar.gz"
checksum-file = "pulumi-{version}-checksums.txt"
archive-prefix = "pulumi"
exes-dirs = ["."]

[install]
download-url = "https://github.com/pulumi/pulumi/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/pulumi/pulumi/releases/download/v{version}/{checksum_file}"

[install.arch]
x64 = "x64"
arm64 = "arm64"

[install.exes.pulumi]
primary = true
exe-path = "pulumi"

[resolve]
git-url = "https://github.com/pulumi/pulumi"
