# proto plugin for age, the file encryption tool, and age-keygen: https://github.com/FiloSottile/age
# Upstream publishes transparency-log proofs rather than a checksum file, so pin the hash with proto's lockfile.
name = "age"
type = "cli"

[platform.linux]
archs = ["x64", "arm64"]
download-file = "age-v{version}-linux-{arch}.tar.gz"
archive-prefix = "age"

[platform.macos]
archs = ["x64", "arm64"]
download-file = "age-v{version}-darwin-{arch}.tar.gz"
archive-prefix = "age"

[install]
download-url = "https://github.com/FiloSottile/age/releases/download/v{version}/{download_file}"

[install.arch]
x64 = "amd64"
arm64 = "arm64"

[install.exes.age]
primary = true
exe-path = "age"

[install.exes.age-keygen]
exe-path = "age-keygen"

[resolve]
git-url = "https://github.com/FiloSottile/age"
