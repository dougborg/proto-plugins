# proto plugin for Bats, the Bash Automated Testing System: https://github.com/bats-core/bats-core
# Bats is plain Bash, and its releases publish no assets, only GitHub's generated source archive.
# This installs a byte-for-byte mirror of that archive from this repository's bats-v{version}
# releases (scripts/mirror-bats.sh), because some networks serve release files but refuse
# archive links. The checksum is unchanged, so existing proto lockfile records stay valid.
# GitHub publishes no checksum for the archive, so pin the hash with proto's lockfile.
name = "bats"
type = "cli"

[platform.linux]
download-file = "bats-core-{version}.tar.gz"
archive-prefix = "bats-core-{version}"

[platform.macos]
download-file = "bats-core-{version}.tar.gz"
archive-prefix = "bats-core-{version}"

[install]
download-url = "https://github.com/dougborg/proto-plugins/releases/download/bats-v{version}/{download_file}"

[install.exes.bats]
primary = true
exe-path = "bin/bats"

[resolve]
git-url = "https://github.com/bats-core/bats-core"
