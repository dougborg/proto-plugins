# proto plugin for ShellCheck, the shell script linter: https://github.com/koalaman/shellcheck
# Upstream publishes no checksum file, so pin the hash with proto's lockfile.
name = "shellcheck"
type = "cli"

[platform.linux]
archs = ["x64", "arm64"]
download-file = "shellcheck-v{version}.linux.{arch}.tar.gz"
archive-prefix = "shellcheck-v{version}"

[platform.macos]
archs = ["x64", "arm64"]
download-file = "shellcheck-v{version}.darwin.{arch}.tar.gz"
archive-prefix = "shellcheck-v{version}"

[install]
download-url = "https://github.com/koalaman/shellcheck/releases/download/v{version}/{download_file}"

[install.arch]
x64 = "x86_64"
arm64 = "aarch64"

[install.exes.shellcheck]
primary = true
exe-path = "shellcheck"

[resolve]
git-url = "https://github.com/koalaman/shellcheck"
